---
# Fictional reserved documentation addresses. Supply your own private inventory.
# Credentials come from prompted secrets / credential store / existing Vault files.
all:
  children:
    census_linux:
      hosts:
        app01:
          ansible_host: 192.0.2.10
        db01:
          ansible_host: 192.0.2.20
      vars:
        ansible_connection: ssh
        ansible_user: census-reader
        # Collector runs via script, with no target-side setup module dependency.
        census_python: /usr/bin/python3
        census_linux_become: false

    census_windows:
      hosts:
        win01.example.test:
          ansible_host: win01.example.test
      vars:
        ansible_connection: psrp
        ansible_psrp_protocol: https
        ansible_port: 5986
        ansible_psrp_auth: kerberos
        ansible_psrp_cert_validation: validate
        ansible_psrp_negotiate_delegate: false
        ansible_user: census-reader@EXAMPLE.TEST
        # Optional controller-side trusted enterprise CA PEM:
        # ansible_psrp_ca_cert: /etc/pki/census/enterprise-ca.pem

    census_network:
      children:
        census_ios:
          hosts:
            switch01:
              ansible_host: 192.0.2.1
          vars:
            census_network_os: ios
            ansible_connection: ansible.netcommon.network_cli
            ansible_network_os: cisco.ios.ios
        census_eos:
          hosts:
            switch02:
              ansible_host: 192.0.2.2
          vars:
            census_network_os: eos
            ansible_connection: ansible.netcommon.network_cli
            ansible_network_os: arista.eos.eos
        # Optional Junos compatibility profile; see requirements-junos.yml.
        # census_junos:
        #   hosts:
        #     router01:
        #       ansible_host: 192.0.2.3
        #   vars:
        #     census_network_os: junos
        #     ansible_connection: ansible.netcommon.netconf
        #     ansible_network_os: junipernetworks.junos.junos
        #     ansible_port: 830
      vars:
        ansible_user: census-reader
        ansible_become: false
