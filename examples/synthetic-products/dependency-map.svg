<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Infrastructure evidence map"><style>text{font-family:Arial,sans-serif} .node{cursor:pointer} .edge{fill:none;stroke-width:2} .edge.selected{stroke-width:5} .dim{opacity:.12}</style><rect width="960" height="420" fill="#f4f7fb"/><text x="30" y="30" font-size="24" font-weight="bold" fill="#233753">Infrastructure census map</text><defs><marker id="manual-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="storage-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e817a"/></marker></defs><text x="30" y="54" font-size="12" fill="#526981">Observed relationships retain evidence; manual context retains source and review date.</text><text x="45" y="90" font-size="18" fill="#233753">LINUX</text><text x="345" y="90" font-size="18" fill="#233753">WINDOWS</text><text x="645" y="90" font-size="18" fill="#233753">NETWORK</text><path class="edge" data-edge="113db562e090bb99" d="M295,163 C320,163 320,273 295,273" stroke="#487c56" stroke-dasharray="none"><title>declared_dependency: Application uses PostgreSQL; confirm with the application owner</title></path><path class="edge" data-edge="1e1cb0df2bd82303" d="M895,273 C920,273 920,163 895,163" stroke="#3974b7" stroke-dasharray="none"><title>physical_neighbor: LLDP/CDP neighbor observation</title></path><path class="edge" data-edge="a5f23224727b235f" d="M330,163 C312.5,163 312.5,163 295,163" stroke="#b46b14" stroke-dasharray="6 4"><title>observed_connection: Unconfirmed application relationship</title></path><path class="edge" data-edge="d4fb161955940751" d="M895,163 C920,163 920,273 895,273" stroke="#3974b7" stroke-dasharray="none"><title>physical_neighbor: LLDP/CDP neighbor observation</title></path><path class="edge" data-edge="d8f8363c3cba47f8" d="M295,163 C312.5,163 312.5,163 330,163" stroke="#b46b14" stroke-dasharray="6 4"><title>observed_connection: Unconfirmed application relationship</title></path><path class="edge" data-edge="dc4a5c686cc22922" d="M295,163 C320,163 320,273 295,273" stroke="#b46b14" stroke-dasharray="6 4"><title>observed_connection: Unconfirmed application relationship</title></path><path class="edge" data-edge="fe36e0801d93b676" d="M295,273 C320,273 320,163 295,163" stroke="#b46b14" stroke-dasharray="6 4"><title>observed_connection: Unconfirmed application relationship</title></path><g class="node" data-node="ad01" tabindex="0" role="button" aria-label="ad01.example.test"><title>ad01</title><rect x="330" y="125" width="265" height="80" rx="10" fill="white" stroke="#899bb4"/><text x="342" y="150" font-size="14" fill="#233753">ad01.example.test</text><text x="342" y="172" font-size="11" fill="#233753">192.0.2.30</text><text x="342" y="191" font-size="10" fill="#233753">Windows Server 2022</text></g><g class="node" data-node="app01" tabindex="0" role="button" aria-label="app01.example.test"><title>app01</title><rect x="30" y="125" width="265" height="80" rx="10" fill="white" stroke="#899bb4"/><text x="42" y="150" font-size="14" fill="#233753">app01.example.test</text><text x="42" y="172" font-size="11" fill="#233753">192.0.2.10</text><text x="42" y="191" font-size="10" fill="#233753">RHEL 9</text></g><g class="node" data-node="db01" tabindex="0" role="button" aria-label="db01.example.test"><title>db01</title><rect x="30" y="235" width="265" height="80" rx="10" fill="white" stroke="#899bb4"/><text x="42" y="260" font-size="14" fill="#233753">db01.example.test</text><text x="42" y="282" font-size="11" fill="#233753">192.0.2.20</text><text x="42" y="301" font-size="10" fill="#233753">RHEL 8</text></g><g class="node" data-node="router01" tabindex="0" role="button" aria-label="router01.example.test"><title>router01</title><rect x="630" y="125" width="265" height="80" rx="10" fill="white" stroke="#899bb4"/><text x="642" y="150" font-size="14" fill="#233753">router01.example.test</text><text x="642" y="172" font-size="11" fill="#233753">192.0.2.1</text><text x="642" y="191" font-size="10" fill="#233753">Cisco IOS XE</text></g><g class="node" data-node="switch01" tabindex="0" role="button" aria-label="switch01.example.test"><title>switch01</title><rect x="630" y="235" width="265" height="80" rx="10" fill="white" stroke="#899bb4"/><text x="642" y="260" font-size="14" fill="#233753">switch01.example.test</text><text x="642" y="282" font-size="11" fill="#233753">192.0.2.2</text><text x="642" y="301" font-size="10" fill="#233753">Cisco IOS XE</text></g><text x="30" y="396" font-size="12" fill="#b46b14">Amber dashed: observed TCP</text><text x="300" y="396" font-size="12" fill="#3974b7">Blue: physical neighbor</text><text x="560" y="396" font-size="12" fill="#487c56">Green: declared dependency</text><text x="560" y="414" font-size="12" fill="#0e817a">Teal: storage observation/configuration</text><text x="30" y="414" font-size="12" fill="#7c3aed">Purple: manual relationship; arrow direction follows its declared meaning</text></svg>