ve</title></path><g class="node" data-node="app01" tabindex="0" role="button" aria-label="app01.example.test"><title>app01</title><rect x="30" y="125" width="265" height="80" rx="10" fill="white" stroke="#899bb4"/><text x="42" y="150" font-size="14" fill="#233753">app01.example.test</text><text x="42" y="172" font-size="11" fill="#233753">192.0.2.10</text><text x="42" y="191" font-size="10" fill="#233753">Example Enterprise Linux 9</text></g><g class="node" data-node="nas01" tabindex="0" role="button" aria-label="nas01.example.test"><title>nas01</title><rect x="30" y="235" width="265" height="80" rx="10" fill="white" stroke="#899bb4"/><text x="42" y="260" font-size="14" fill="#233753">nas01.example.test</text><text x="42" y="282" font-size="11" fill="#233753">192.0.2.50</text><text x="42" y="301" font-size="10" fill="#233753">Example Linux</text></g><g class="node" data-node="storage:archive.example.test" tabindex="0" role="button" aria-label="archive.example.test"><title>storage:archive.example.test</title><rect x="630" y="125" width="265" height="80" rx="10" fill="white" stroke="#899bb4"/><text x="642" y="150" font-size="14" fill="#233753">archive.example.test</text><text x="642" y="172" font-size="11" fill="#233753">Address unknown</text><text x="642" y="191" font-size="10" fill="#233753">Unknown</text></g><g class="node" data-node="win01" tabindex="0" role="button" aria-label="win01.example.test"><title>win01</title><rect x="330" y="125" width="265" height="80" rx="10" fill="white" stroke="#899bb4"/><text x="342" y="150" font-size="14" fill="#233753">win01.example.test</text><text x="342" y="172" font-size="11" fill="#233753">192.0.2.30</text><text x="342" y="191" font-size="10" fill="#233753">Example Windows Server</text></g><text x="30" y="396" font-size="12" fill="#b46b14">Amber dashed: observed TCP</text><text x="300" y="396" font-size="12" fill="#3974b7">Blue: physical neighbor</text><text x="560" y="396" font-size="12" fill="#487c56">Green: declared dependency</text><text x="560" y="414" font-size="12" fill="#0e817a">Teal: storage observation/configuration</text><text x="30" y="414" font-size="12" fill="#7c3aed">Purple: manual relationship; arrow direction follows its declared meaning</text></svg>