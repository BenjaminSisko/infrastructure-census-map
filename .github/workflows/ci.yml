name: Census source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-reporting.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile collectors/linux_census.py tools/bundle.py tools/census.py tools/offline.py tools/release.py renderer/render.py
      - run: python tools/release.py --check-only
      - run: python tools/census.py demo --run-id ci-demo
  ansible-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install ansible-core==2.21.1 -r requirements-reporting.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-playbook -i inventories/example/hosts.yml playbooks/collect-census.yml --syntax-check -e census_run_id=ci-syntax
      - name: Test additive integration in a fictional parent repository
        run: CENSUS_RUN_INTEGRATION_TESTS=1 python -m unittest discover -s tests -p test_integration.py -v
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python renderer/render.py --evidence examples/synthetic --manual model/manual-context.example.yml --declared model/declared-dependencies.example.json --output examples/synthetic-with-manual-products
      - run: python renderer/render.py --manual examples/manual-only/context.yml --output examples/manual-only-products
      - run: node --check renderer/static/workbench.js
      - run: CENSUS_REPORT_PYTHON="$(command -v python)" node tests/workbench-browser.cjs
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Parse Windows collector without executing it
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/collectors/windows_census.ps1", [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { $parseErrors; exit 1 }
