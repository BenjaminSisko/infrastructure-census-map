---
- name: Collect operational Cisco IOS facts
  cisco.ios.ios_facts:
    gather_subset:
      - min
      - hardware
      - interfaces
  register: census_network_base
  changed_when: false
  ignore_errors: true
  ignore_unreachable: true
  no_log: true

- name: Collect optional allowlisted Cisco L2 resource facts
  cisco.ios.ios_facts:
    gather_subset:
      - min
    gather_network_resources:
      - l2_interfaces
      - vlans
  register: census_network_l2
  when:
    - census_network_collect_l2 | default(false) | bool
    - not (census_network_base.failed | default(false))
    - not (census_network_base.unreachable | default(false))
  changed_when: false
  ignore_errors: true
  ignore_unreachable: true
  no_log: true
